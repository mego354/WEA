<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - WEA Pharma ERP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#27bebe',
                            600: '#20a3a3',
                            700: '#1a8b8b'
                        }
                    },
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-brand-500 selection:text-white">

    <div class="w-full max-w-md">
        <!-- Logo & Brand Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-500 mx-auto flex items-center justify-center text-white shadow-lg shadow-brand-500/25 mb-4 text-3xl font-extrabold">
                W
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">WEA PHARMA</h1>
            <p class="text-sm text-slate-500 mt-1">نظام إدارة الموارد المؤسسي والعمليات الدوائية</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6 sm:p-8">
            <h2 class="text-lg font-bold text-slate-800 mb-6">تسجيل الدخول إلى حسابك</h2>

            {% if messages %}
            <div class="mb-5 space-y-2">
                {% for message in messages %}
                <div class="p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2 {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
                    <span class="material-symbols-outlined text-base">info</span>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}" class="space-y-5">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">

                <!-- Email / Username Input -->
                <div>
                    <label for="email" class="block text-xs font-bold text-slate-700 mb-1.5">البريد الإلكتروني أو اسم المستخدم</label>
                    <div class="relative">
                        <input type="text" id="email" name="email" required
                               class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all text-slate-900 min-h-[46px]"
                               placeholder="user@wea.com أو اسم المستخدم">
                        <span class="material-symbols-outlined absolute right-3 top-3 text-slate-400 text-lg">mail</span>
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required
                               class="w-full pr-10 pl-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all text-slate-900 min-h-[46px]"
                               placeholder="Enter your Password">
                        <span class="material-symbols-outlined absolute right-3 top-3 text-slate-400 text-lg">lock</span>
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute left-2 top-2 p-1.5 min-w-[36px] min-h-[36px] flex items-center justify-center text-slate-400 hover:text-slate-600 focus:outline-none" aria-label="إظهار كلمة المرور">
                            <span id="eye-icon" class="material-symbols-outlined text-lg">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Remember & Forgot -->
                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-600 min-h-[36px]">
                        <input type="checkbox" checked class="w-4 h-4 rounded text-brand-500 focus:ring-brand-500 border-slate-300">
                        <span>تذكرني على هذا الجهاز</span>
                    </label>
                    <a href="#" class="text-brand-600 hover:underline font-medium min-h-[36px] flex items-center">نسيت كلمة المرور؟</a>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full py-3 px-4 bg-brand-500 hover:bg-brand-600 active:bg-brand-700 text-white font-bold rounded-xl shadow-md shadow-brand-500/25 transition-all flex items-center justify-center gap-2 text-sm mt-2 min-h-[48px]">
                    <span>تسجيل الدخول</span>
                    <span class="material-symbols-outlined text-base">login</span>
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">
            &copy; 2026 WEA Pharma. جميع الحقوق محفوظة.
        </p>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }
    </script>
</body>
</html>
