<!-- Reusable Multi-Attachment Uploader for Create/Edit Forms -->
<div class="bg-white rounded-2xl border border-slate-200/80 p-4 sm:p-5 shadow-xs space-y-3">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
        <h3 class="text-xs sm:text-sm font-bold text-slate-900 flex items-center gap-2">
            <span class="material-symbols-outlined text-[#27bebe] text-lg">attach_file</span>
            <span>{{ title|default:"المرفقات والمستندات (صور / PDF)" }}</span>
        </h3>
        <span class="text-[11px] text-slate-400 font-medium">JPG, PNG, WEBP, PDF • بحد أقصى 10 MB للملف</span>
    </div>

    <label class="flex flex-col items-center justify-center gap-2 p-4 border-2 border-dashed border-slate-300 hover:border-[#27bebe] rounded-xl bg-slate-50/70 hover:bg-teal-50/30 cursor-pointer transition-colors text-center">
        <span class="material-symbols-outlined text-2xl text-[#27bebe]">cloud_upload</span>
        <span class="text-xs font-bold text-slate-700">اضغط لاختيار ملفات أو اسحبها هنا (متعدد)</span>
        <input type="file"
               name="{{ input_name|default:'attachments' }}"
               multiple
               accept=".jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf"
               class="hidden"
               onchange="window.renderAttachmentPreviewChips && window.renderAttachmentPreviewChips(this)">
    </label>

    <div class="attachment-preview-list flex flex-wrap gap-2"></div>
</div>

<script>
if (!window.renderAttachmentPreviewChips) {
    window.renderAttachmentPreviewChips = function(input) {
        const container = input.closest('div').querySelector('.attachment-preview-list');
        if (!container) return;
        container.innerHTML = '';
        const files = Array.from(input.files || []);
        files.forEach(file => {
            const chip = document.createElement('div');
            chip.className = 'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-teal-50 border border-teal-200 text-teal-900 text-xs font-semibold';
            const isPdf = file.name.toLowerCase().endsWith('.pdf');
            const mb = (file.size / (1024 * 1024)).toFixed(2);
            const safeName = window.erpEscapeHtml ? window.erpEscapeHtml(file.name) : file.name.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            chip.innerHTML = `<span class="material-symbols-outlined text-sm text-[#27bebe]">${isPdf ? 'picture_as_pdf' : 'image'}</span>` +
                             `<span class="truncate max-w-[180px]">${safeName}</span>` +
                             `<span class="text-[10px] text-slate-500 font-mono">(${mb} MB)</span>`;
            container.appendChild(chip);
        });
    };
}
</script>
