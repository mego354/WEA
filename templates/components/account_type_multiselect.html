{% load static %}
<!-- Shared Reusable Account Type Multiselect Component -->
<div class="space-y-1.5" id="{{ component_id }}_account_type_wrapper">
    <label class="block text-[11px] font-bold text-slate-600 mb-1">{{ label|default:"نوع الحساب (اختيار متعدد)" }}</label>
    
    <!-- Selected Chips Container -->
    <div id="{{ component_id }}_selected_account_types_chips" class="flex flex-wrap gap-1.5 mb-1.5 empty:hidden">
        {% for at in selected_account_types %}
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-lg bg-teal-50 text-teal-800 border border-teal-200 text-xs font-semibold shadow-2xs" data-account-type="{{ at }}">
            <input type="hidden" name="{{ field_name|default:'account_type' }}" value="{{ at }}">
            <span>{{ at }}</span>
            <button type="button" data-remove-account-type="{{ at }}" class="text-teal-500 hover:text-rose-600 focus:outline-hidden inline-flex items-center" title="إزالة">
                <span class="material-symbols-outlined text-[13px] leading-none">close</span>
            </button>
        </span>
        {% endfor %}
    </div>

    <!-- Search / Dropdown Input Container -->
    <div class="relative" id="{{ component_id }}_account_type_container">
        <div class="relative">
            <input type="text"
                   id="{{ component_id }}_search_account_type_input"
                   placeholder="اضغط لاختيار نوع الحساب أو اكتب للبحث..."
                   autocomplete="off"
                   class="w-full min-h-[38px] rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 pe-8 text-xs font-medium text-slate-800 placeholder:text-slate-400 focus:border-[#27bebe] focus:ring-1 focus:ring-[#27bebe] transition-colors cursor-pointer">
            <span id="{{ component_id }}_account_type_icon" class="material-symbols-outlined text-sm text-slate-400 absolute end-2.5 top-2.5 pointer-events-none">expand_more</span>
        </div>
        <div id="{{ component_id }}_search_account_type_dropdown" class="absolute z-40 start-0 end-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-52 overflow-y-auto hidden text-xs divide-y divide-slate-100">
            {% for at in available_account_types %}
            <div class="px-3 py-2 hover:bg-teal-50/60 cursor-pointer flex items-center justify-between transition-colors account-type-option" data-value="{{ at }}">
                <span class="font-medium text-slate-800">{{ at }}</span>
                <span class="material-symbols-outlined text-sm text-[#27bebe] hidden option-check">check</span>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<script src="{% static 'js/account_type_multiselect.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    if (window.initAccountTypeMultiselect) {
        window.initAccountTypeMultiselect({
            componentId: "{{ component_id|escapejs }}",
            fieldName: "{{ field_name|default:'account_type'|escapejs }}",
            onChangeCallback: "{{ on_change_callback|default:''|escapejs }}"
        });
    }
});
</script>
