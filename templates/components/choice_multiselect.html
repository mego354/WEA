{% load static %}
<!-- Shared Reusable Generic Choice Multiselect Component -->
<div class="space-y-1.5" id="{{ component_id }}_choice_wrapper">
    <div class="flex items-center justify-between gap-2">
        <label class="block text-[11px] font-bold text-slate-600">{{ label|default:"اختيار متعدد" }}</label>
        <button type="button" id="{{ component_id }}_choice_clear_btn"
                class="text-[10px] font-bold text-rose-600 hover:underline {% if not selected_values %}hidden{% endif %}">
            مسح
        </button>
    </div>

    <!-- Selected Chips Container -->
    <div id="{{ component_id }}_selected_choices_chips" class="flex flex-wrap gap-1.5 empty:hidden">
        {% for item in selected_items %}
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-lg bg-teal-50 text-teal-800 border border-teal-200 text-xs font-semibold shadow-2xs max-w-full" data-choice-val="{{ item.value }}">
            <input type="hidden" name="{{ field_name }}" value="{{ item.value }}">
            <span class="truncate max-w-[160px]">{{ item.label }}</span>
            <button type="button" data-remove-choice="{{ item.value }}" class="text-teal-500 hover:text-rose-600 focus:outline-hidden inline-flex items-center shrink-0" title="إزالة">
                <span class="material-symbols-outlined text-[13px] leading-none">close</span>
            </button>
        </span>
        {% endfor %}
    </div>

    <!-- Search / Dropdown Input Container -->
    <div class="relative" id="{{ component_id }}_choice_container">
        <div class="relative">
            <input type="text"
                   id="{{ component_id }}_search_choice_input"
                   placeholder="{{ placeholder|default:'اضغط للاختيار أو اكتب للبحث...' }}"
                   autocomplete="off"
                   class="w-full min-h-[38px] rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 pe-8 text-xs font-medium text-slate-800 placeholder:text-slate-400 focus:border-[#27bebe] focus:ring-1 focus:ring-[#27bebe] transition-colors cursor-pointer">
            <span class="material-symbols-outlined text-sm text-slate-400 absolute end-2.5 top-2.5 pointer-events-none">expand_more</span>
        </div>
        <div id="{{ component_id }}_search_choice_dropdown" class="absolute z-40 start-0 end-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-52 overflow-y-auto hidden text-xs divide-y divide-slate-100">
            {% for opt in options %}
            <div class="px-3 py-2 min-h-[36px] hover:bg-teal-50/60 cursor-pointer flex items-center justify-between transition-colors choice-ms-option"
                 data-value="{{ opt.value }}" data-label="{{ opt.label }}">
                <span class="font-medium text-slate-800 truncate">{{ opt.label }}</span>
                <span class="material-symbols-outlined text-sm text-[#27bebe] hidden option-check shrink-0">check</span>
            </div>
            {% endfor %}
            <div id="{{ component_id }}_choice_empty_state" class="p-3 text-center text-slate-400 text-xs hidden">
                لا توجد خيارات مطابقة.
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/choice_multiselect.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    if (window.initChoiceMultiselect) {
        window.initChoiceMultiselect({
            componentId: "{{ component_id|escapejs }}",
            fieldName: "{{ field_name|escapejs }}",
            onChangeCallback: "{{ on_change_callback|default:''|escapejs }}"
        });
    }
});
</script>
