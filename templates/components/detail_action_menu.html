<!-- Unified Detail Page Secondary Actions Menu (Viewport-Safe more_vert RTL Dropdown) -->
<div class="relative inline-block text-right" data-detail-action-menu>
    <button type="button"
            onclick="toggleDetailActionMenu(this)"
            aria-haspopup="true"
            aria-expanded="false"
            class="inline-flex items-center justify-center w-10 h-10 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 hover:text-slate-900 shadow-2xs transition-colors"
            title="{{ menu_title|default:'إجراءات إضافية' }}"
            aria-label="{{ menu_title|default:'إجراءات إضافية' }}">
        <span class="material-symbols-outlined text-[20px]">more_vert</span>
    </button>
    <div class="detail-action-dropdown hidden fixed z-[110] min-w-[200px] max-w-[260px] rounded-xl bg-white border border-slate-200 shadow-2xl py-1.5 text-xs font-semibold text-slate-700">
        {{ menu_items }}
    </div>
</div>
